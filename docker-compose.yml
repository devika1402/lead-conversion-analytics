services:
  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: virtuagym
      POSTGRES_USER: vguser
      POSTGRES_PASSWORD: vgpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - gym-network

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - gym-network

  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    container_name: api-server
    ports:
      - "8000:8000"
    restart: always
    networks:
      - gym-network
    depends_on:
      - db

  server-etl:
    build:
      context: ./server-etl
      dockerfile: Dockerfile
    container_name: server-etl
    depends_on:
      - db
      - api-server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: virtuagym
      DB_USER: vguser
      DB_PASS: vgpass
      API_URL: http://api-server:8000/leads
    command: ["python", "main.py"]
    networks:
      - gym-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    environment:
      - DATABASE_URL=postgresql://vguser:vgpass@db:5432/virtuagym
    ports:
      - "8501:8501"
    networks:
      - gym-network
    depends_on:
      - db

  db-backup:
    image: postgres:15
    container_name: postgres-backup
    environment:
      POSTGRES_DB: virtuagym
      POSTGRES_USER: vguser
      POSTGRES_PASSWORD: vgpass
    volumes:
      - postgres_data:/var/lib/postgresql/data  
      - ./db/backups:/backups                   
    entrypoint: ["/bin/bash", "-c", "trap exit TERM; while :; do pg_dump -U vguser -d virtuagym -F c -f /backups/backup_$(date +'%Y-%m-%d_%H-%M-%S').dump; sleep 86400; done"]
    depends_on:
      - db
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge

volumes:
  postgres_data:
